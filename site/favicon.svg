<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Magnifying glass circle -->
  <circle cx="13" cy="13" r="6.5" stroke="white" stroke-width="2.5" fill="none"/>

  <!-- Magnifying glass handle -->
  <line x1="17.5" y1="17.5" x2="23" y2="23" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Breadcrumb dots trailing from handle -->
  <circle cx="25.5" cy="25.5" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="27.5" cy="25.5" r="1" fill="white" opacity="0.6"/>
  <circle cx="29.5" cy="25.5" r="0.6" fill="white" opacity="0.3"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
</svg>
