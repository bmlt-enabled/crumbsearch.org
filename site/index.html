<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crumb Search - Meeting Finder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="description" content="Find Narcotics Anonymous meetings near you — in-person and virtual." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crumb Search" />
    <meta property="og:title" content="Crumb Search - Meeting Finder" />
    <meta property="og:description" content="Find Narcotics Anonymous meetings near you — in-person and virtual." />
    <meta property="og:url" content="https://crumbsearch.org/" />
    <meta property="og:image" content="https://crumbsearch.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crumb Search - Meeting Finder" />
    <meta name="twitter:description" content="Find Narcotics Anonymous meetings near you — in-person and virtual." />
    <meta name="twitter:image" content="https://crumbsearch.org/og-image.png" />
    <style>
        :root {
            --demo-bar-height: 56px;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            padding-top: var(--demo-bar-height);
            box-sizing: border-box;
        }

        body.dark {
            background: #0f172a;
        }

        #demo-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--demo-bar-height);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-sizing: border-box;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid #e5e7eb;
        }

        #demo-bar-title {
            font-family: system-ui, sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin: 0;
        }

        body.dark #demo-bar-title {
            color: #f1f5f9;
        }

        body.dark #demo-bar {
            background: rgba(15,23,42,0.95);
            border-color: #334155;
        }

        #dark-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .demo-bar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .demo-bar-link {
            font-family: system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
            white-space: nowrap;
        }

        .demo-bar-link:hover {
            text-decoration: underline;
        }

        body.dark .demo-bar-link {
            color: #60a5fa;
        }

        #crumb-widget {
            display: block;
            width: 100%;
            min-height: calc(100vh - var(--demo-bar-height));
        }
    </style>
</head>
<body>
<div id="demo-bar">
    <span id="demo-bar-title">Narcotics Anonymous Meeting Finder</span>
    <div class="demo-bar-actions">
        <a class="demo-bar-link" href="/virtual">Virtual Meetings</a>
        <button id="dark-btn" onclick="toggleDark()">🌙</button>
    </div>
</div>

<div
    id="crumb-widget"
    data-server="https://aggregator.bmltenabled.org/main_server/"
    data-path=""
></div>

<script>
    var CrumbWidgetConfig = {
        geolocation: true,
        hideHeader: true,
    };

    function applyDarkState(isDark) {
        document.body.classList.toggle('dark', isDark);
        var w = document.getElementById('crumb-widget');
        if (w) w.classList.toggle('bmlt-dark-force', isDark);
        document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
    }

    function toggleDark() {
        var isDark = !document.body.classList.contains('dark');
        localStorage.setItem('crumb-dark', isDark ? 'dark' : 'light');
        applyDarkState(isDark);
    }
</script>

<script type="module" src="https://cdn.aws.bmlt.app/crumb-widget.js"></script>

<script>
    var saved = localStorage.getItem('crumb-dark');
    var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyDarkState(isDark);
</script>
</body>
</html>
